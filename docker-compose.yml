
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventmanager_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/events.db
    volumes:
      - events_sqlite_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eventmanager_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  events_sqlite_data:
